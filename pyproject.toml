[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sinricpro"
description = "SinricPro library for MicroPython and CircuitPython"
version = "2.2.0"
authors = [
    {name = "SinricPro", email = "support@sinric.com"}
]
urls = {Homepage = "https://sinric.pro"}
license = {text = "MIT"}
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = [
    "sinricpro",
    "sinric"
    "micropython",
    "circuitpython",
]